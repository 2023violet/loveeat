/* ============ 设计 Token：草莓奶油小厨房 v2 ============ */
:root{
  --bg:#FFF6EF;            /* 奶油米白 */
  --surface:#FFFDFA;       /* 卡片面 */
  --surface-2:#FFF3E8;
  --canvas:#E8E8E4;        /* 桌面预览画布（原硬编码，现入 token） */
  --ink:#3B2A25;           /* 可可棕 · 主文本 */
  --ink-soft:#7E5C52;      /* 次文本 · 5.6:1 */
  --muted-ink:#836254;     /* 三级小字 · 四种底色上最低 4.69:1（V1 的 #B39689 只有 2.58:1） */
  --icon-idle:#A8756A;     /* 未激活图标 · 3.6:1（替掉原 #C9A9A0 的 2.1:1） */
  --rose-50:#FCE9EC;
  --rose-100:#F8D9DE;
  --rose-300:#EFA9B5;
  --rose-500:#E2798C;      /* 装饰级玫瑰 */
  --rose-600:#C8495E;      /* 主操作玫瑰 · 白字 4.6:1 */
  --rose-700:#A93A4E;      /* 文本级玫瑰 · 5.8:1 */
  --dis-bg:#EFD9DE; --dis-fg:#6F4F56;   /* 不可用态（原 1.45:1） */
  --butter-100:#FBEFD3;
  --butter-500:#F2B33D;
  --butter-700:#8C6312;
  --green-100:#E7F3E8;
  --green-700:#3F7244;
  --line:#F2DED6;
  --shadow-1:0 6px 20px rgba(88,46,38,.08);
  --shadow-2:0 14px 36px rgba(88,46,38,.16);
  --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:24px;
  --tap:44px;              /* 最小触控目标 */
  --ease:cubic-bezier(.2,0,0,1);
  --font-title:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Source Han Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-hand:"ChillKai","Kaiti SC","STKaiti","KaiTi","PingFang SC","Microsoft YaHei",serif;
  --font-num:"Baloo 2","ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-body); color:var(--ink);
  background:var(--canvas);
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation}
img{display:block;max-width:100%}
ul{list-style:none}
:focus-visible{outline:2.5px solid var(--rose-700);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
[u-cloak],[data-cloak]{display:none}

/* ============ 手机壳 ============ */
.phone-shell{
  --shell-r:48px;   /* 壳圆角，底部栏要跟着走，否则直角被裁会露出底色 */
  position:relative; width:390px; height:844px;
  max-height:calc(100vh - 32px); max-width:calc(100vw - 32px);
  background:var(--bg); border-radius:48px; overflow:hidden;
  box-shadow:0 0 0 10px #2b2523, 0 0 0 12px #4a423e, var(--shadow-2);
  isolation:isolate;
}
.phone-shell *{scrollbar-width:none}
.phone-shell ::-webkit-scrollbar{display:none}
.status-bar{
  position:absolute; top:0; left:0; right:0; height:48px; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 26px 0; font-family:var(--font-num); font-weight:700; font-size:14px;
  pointer-events:none; color:var(--ink);
}
.status-bar .sb-icons{display:flex; gap:5px; align-items:center}
.notch{position:absolute; top:10px; left:50%; transform:translateX(-50%);
  width:112px; height:26px; border-radius:999px; background:#2b2523; z-index:51; opacity:.92}
.home-indicator{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:120px;height:5px;border-radius:99px;background:var(--ink);opacity:.28;z-index:60;pointer-events:none}
.sprite{position:absolute;width:0;height:0;overflow:hidden}

/* ============ 屏幕路由 ============ */
.screen{
  position:absolute; inset:0; background:var(--bg);
  opacity:0; transform:translateX(26px); pointer-events:none; z-index:1;
  transition:opacity .26s var(--ease), transform .26s var(--ease);
}
.screen.active{opacity:1;transform:translateX(0);pointer-events:auto;z-index:2}
.phone-shell.nav-back .screen{transform:translateX(-26px)}
.phone-shell.nav-back .screen.active{transform:translateX(0)}
.screen-scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scr-h{outline:none}

/* ============ 通用组件 ============ */
.chip{
  display:inline-flex; align-items:center; gap:4px; justify-content:center;
  min-height:var(--tap); padding:0 16px; border-radius:999px;
  background:var(--surface); border:1.5px solid var(--line);
  font-size:14px; font-weight:600; color:var(--ink-soft);
  transition:transform .12s var(--ease), background .15s, color .15s, border-color .15s;
}
.chip:active{transform:scale(.94)}
.chip--sm{min-height:var(--tap);padding:0 14px;font-size:13.5px}
.chip[aria-pressed="true"],.chip.on{background:var(--rose-600); border-color:var(--rose-600); color:#fff}
.tag-mini{
  display:inline-flex;align-items:center;gap:3px;
  font-size:11.5px;font-weight:600;color:var(--ink-soft);
  background:var(--rose-50);border-radius:8px;padding:4px 8px;
}
.tag-mini svg{width:12px;height:12px}
.num{font-family:var(--font-num);font-weight:700}
.icon{width:1.2em;height:1.2em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon-fill{fill:currentColor;stroke:none}
.art{display:block;width:100%;height:100%}

@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.35)}100%{transform:scale(1)}}
.pop{animation:pop .4s var(--ease)}
@keyframes heartBeat{0%,100%{transform:scale(1)}12%{transform:scale(1.14)}24%{transform:scale(1)}36%{transform:scale(1.12)}48%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeIn .22s var(--ease)}

/* Toast */
.toast-wrap{position:absolute;top:60px;left:0;right:0;display:flex;justify-content:center;z-index:80;pointer-events:none}
.toast{
  background:rgba(59,42,37,.92);color:#FFF6EF;font-size:13.5px;font-weight:600;
  padding:11px 20px;border-radius:999px;box-shadow:var(--shadow-1);
  opacity:0;transform:translateY(-8px);transition:.24s var(--ease);max-width:300px;text-align:center;
}
.toast.show{opacity:1;transform:translateY(0)}

/* 模态 */
.modal-mask{
  position:absolute;inset:0;z-index:70;background:rgba(59,42,37,.42);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;transition:opacity .22s var(--ease);pointer-events:none;
}
.modal-mask.show{opacity:1;pointer-events:auto}
.modal-card{
  width:100%;background:var(--bg);border-radius:28px 28px 0 0;padding:26px 22px 26px;
  transform:translateY(30px);transition:transform .26s var(--ease);
  box-shadow:var(--shadow-2);position:relative;
  max-height:78%;overflow-y:auto;overscroll-behavior:contain;
}
.modal-mask.show .modal-card{transform:translateY(0)}
.modal-grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.x-btn{position:absolute;top:12px;right:12px;width:var(--tap);height:var(--tap);
  display:flex;align-items:center;justify-content:center;color:var(--muted-ink);border-radius:999px}

/* 底部操作条 */
.action-bar{
  position:absolute;left:0;right:0;bottom:0;z-index:30;
  padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top, var(--bg) 82%, rgba(255,246,239,0));
  display:flex;gap:12px;align-items:center;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font-weight:700;border-radius:999px;transition:transform .12s var(--ease), box-shadow .15s;
}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--rose-600);color:#fff;min-height:52px;padding:0 26px;font-size:17px;
  box-shadow:0 8px 18px rgba(200,73,94,.32)}
.btn-primary[aria-disabled="true"]{background:var(--dis-bg);color:var(--dis-fg);box-shadow:none;cursor:default}
.btn-soft{background:var(--rose-50);color:var(--rose-700);min-height:52px;padding:0 24px;font-size:16px}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink-soft);min-height:52px;padding:0 22px;font-size:15.5px}
.btn-butter{background:var(--butter-500);color:#4A3305;min-height:52px;padding:0 24px;font-size:15.5px;box-shadow:0 8px 18px rgba(242,179,61,.35)}
.btn-sm{min-height:var(--tap);padding:0 16px;font-size:14px}

/* 购物车悬浮条 */
.cart-bar{
  position:absolute;left:16px;right:16px;bottom:82px;z-index:35;
  min-height:56px;border-radius:999px;background:var(--rose-600);color:#fff;
  display:flex;align-items:center;gap:10px;padding:8px 8px 8px 18px;
  box-shadow:0 10px 24px rgba(200,73,94,.4);
  transform:translateY(16px);opacity:0;pointer-events:none;transition:.22s var(--ease);
  width:calc(100% - 32px);text-align:left;
}
.cart-bar.show{transform:translateY(0);opacity:1;pointer-events:auto}
.cart-bar .cb-count{
  background:#fff;color:var(--rose-600);border-radius:999px;min-width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-weight:800;font-size:14px}
.cart-bar .cb-info{flex:1;font-size:15px;font-weight:700}
.cart-bar .cb-price{font-family:var(--font-num);font-weight:800;font-size:16px}
.cart-bar .cb-go{
  background:#fff;color:var(--rose-700);border-radius:999px;min-height:var(--tap);padding:0 18px;
  font-size:15px;font-weight:800;display:flex;align-items:center}

/* Tab 栏 */
.tab-bar{
  position:absolute;left:0;right:0;bottom:0;z-index:40;height:76px;
  display:flex;background:rgba(255,253,250,.94);backdrop-filter:blur(10px);
  border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
  border-radius:0 0 var(--shell-r,0) var(--shell-r,0);
  transition:transform .26s var(--ease)}
.tab-bar.hidden{transform:translateY(90px)}
.tab-item{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-soft);font-size:11px;font-weight:600;min-height:var(--tap)}
.tab-item .icon{width:24px;height:24px}
.tab-item.on{color:var(--rose-600)}
.tab-item.on .icon{animation:pop .35s var(--ease)}
.tab-item .ti-badge{position:absolute;top:8px;right:calc(50% - 22px);min-width:17px;height:17px;padding:0 4px;
  border-radius:99px;background:var(--butter-500);color:#4A3305;font-family:var(--font-num);font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center}

/* 骨架屏 */
.skel{background:var(--surface-2);border-radius:var(--r-md);position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;
  background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.75) 50%, transparent 70%);
  animation:shimmer 1.15s infinite; transform:translateX(-100%)}
@keyframes shimmer{to{transform:translateX(100%)}}
.skel-card{background:var(--surface);border-radius:var(--r-lg);padding:11px;display:flex;gap:12px;margin-bottom:12px;box-shadow:var(--shadow-1)}
.skel-thumb{width:92px;height:92px;border-radius:var(--r-md);flex:none}
.skel-lines{flex:1;display:flex;flex-direction:column;gap:10px;padding-top:6px}
.skel-line{height:13px;border-radius:6px}
.skel-line.w60{width:60%}.skel-line.w90{width:90%}.skel-line.w40{width:40%}

/* ============ 首页 ============ */
.home-head{padding:64px 18px 6px}
.head-top{display:flex;align-items:center;gap:12px}
.avatar-btn{position:relative;width:var(--tap);height:var(--tap);flex:none;border-radius:999px;
  background:var(--rose-100);display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:var(--shadow-1)}
.avatar-btn .ab-tag{position:absolute;bottom:-3px;right:-3px;padding:1px 5px;border-radius:99px;
  background:var(--rose-600);color:#fff;font-size:10px;font-weight:800;border:1.5px solid var(--bg);line-height:1.4}
.avatar-btn.chef .ab-tag{background:var(--butter-500);color:#4A3305}
.greet{flex:1;min-width:0}
.greet h1{font-family:var(--font-title);font-size:19px;font-weight:400;letter-spacing:.3px;line-height:1.3}
.greet .greet-sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.wallet-chip{flex:none;display:flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 14px 0 11px;
  background:var(--surface);border:1.5px solid var(--rose-100);border-radius:999px;
  box-shadow:var(--shadow-1);color:var(--rose-700)}
.wallet-chip .num{font-size:16px}
.wallet-chip .icon{width:19px;height:19px}
.search-bar{margin-top:14px;display:flex;align-items:center;gap:9px;min-height:48px;
  background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:0 12px 0 18px;box-shadow:var(--shadow-1)}
.search-bar .icon{color:var(--muted-ink)}
.search-bar input{flex:1;border:none;background:none;outline:none;color:var(--ink);
  font-family:inherit; font-size:16px; min-width:0; height:100%; min-height:var(--tap);
  appearance:none;-webkit-appearance:none}
.search-bar input::placeholder{color:var(--muted-ink);font-size:14.5px;letter-spacing:.2px}
.search-bar input::-webkit-search-cancel-button,
.search-bar input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none;width:0}
.search-clear{width:var(--tap);height:var(--tap);border-radius:99px;color:var(--muted-ink);
  display:none;align-items:center;justify-content:center;flex:none;margin-right:-4px}
.search-clear.show{display:flex}
/* 分类行：300 道菜后分类会变多，4 列网格会堆成 3 行占掉首屏，改单行横滚；
   筛选按钮固定在右侧不参与滚动，否则它会被推出屏幕 */
.cat-wrap{display:flex;align-items:center;gap:8px;padding:12px 0 2px}
.cat-row{flex:1;min-width:0;display:flex;flex-wrap:nowrap;gap:8px;padding-left:18px;
  overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 10px),transparent 100%);
  mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 10px),transparent 100%)}
.cat-row::-webkit-scrollbar{display:none}
.cat-row::after{content:"";flex:none;width:2px}
.cat-row .chip{flex:none;scroll-snap-align:center;font-size:13.5px;padding:0 14px}
/* 收藏是"我的"维度，不是菜系：只降视觉层级 */
.cat-row .chip--fav{background:transparent;border-style:dashed;border-color:var(--rose-300);color:var(--rose-700)}
.cat-row .chip--fav.on{background:var(--rose-600);border-style:solid;border-color:var(--rose-600);color:#fff}
/* 筛选入口：固定右侧，带已选条件计数 */
.chip--filter{flex:none;margin-right:18px;background:var(--surface-2);border-color:var(--line);color:var(--ink-soft);gap:3px}
.chip--filter.has{background:var(--butter-100);border-color:var(--butter-500);color:var(--butter-700)}
.chip--filter b{font-family:var(--font-num);font-weight:800;margin-left:2px}
/* 手气不错：固定入口，在筛选旁边，不随分类横滚 */
.chip--surprise{flex:none;background:var(--butter-100);border-color:var(--butter-500);color:var(--butter-700);gap:4px}
.home-body{padding:10px 18px 128px}

/* 开饭了横幅 */
.ready-ribbon{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:var(--green-100);color:var(--green-700);border-radius:var(--r-md);
  padding:12px 14px;margin-bottom:14px;font-size:13.5px;font-weight:700;box-shadow:var(--shadow-1)}
.ready-ribbon .rr-go{margin-left:auto;flex:none;white-space:nowrap;min-height:32px;padding:0 12px;border-radius:99px;background:var(--green-700);color:#fff;font-size:12px;display:flex;align-items:center}

/* 今日招牌 */
.hero-card{position:relative;display:block;width:100%;border-radius:var(--r-xl);overflow:hidden;
  box-shadow:var(--shadow-1);margin-bottom:18px;background:var(--surface-2);text-align:left}
.hero-card .hc-art{width:100%;height:168px;display:block;background:var(--surface-2)}
.hero-shade{position:absolute;inset:0;background:linear-gradient(to top, rgba(59,29,24,.66) 0%, rgba(59,29,24,0) 58%)}
.hero-ribbon{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:5px;
  background:rgba(255,246,239,.94);color:var(--rose-700);font-size:12px;font-weight:800;
  padding:6px 11px;border-radius:999px}
.hero-info{position:absolute;left:16px;right:16px;bottom:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;color:#FFF6EF}
.hero-info>span:first-child{min-width:0}
.hero-info .hi-name{display:block;font-family:var(--font-title);font-size:21px;letter-spacing:.5px}
.hero-info .hi-sub{font-size:12px;opacity:.95;margin-top:2px;display:flex;align-items:center;gap:5px}
.hero-info .hi-price{font-family:var(--font-num);font-weight:800;font-size:22px;flex:none}
.hero-info .hi-price small{font-size:11px;font-weight:700;opacity:.9;margin-right:2px}

/* 菜品卡片 */
.dish-card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-1);
  padding:11px;display:flex;gap:12px;margin-bottom:12px}
.dish-art-box{width:92px;height:92px;border-radius:var(--r-md);flex:none;background:var(--surface-2);overflow:hidden;padding:0}
.art-block{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.art-block b{font-family:var(--font-title);font-size:30px;font-weight:400;line-height:1;color:rgba(59,42,37,.7)}
.dish-open{display:block;width:100%;min-height:var(--tap);text-align:left;padding:0}
.dish-open .dish-name,.dish-open .dish-desc{display:block}
.dish-main{flex:1;min-width:0;display:flex;flex-direction:column}
.dish-name{font-family:var(--font-title);font-size:17.5px;letter-spacing:.4px}
.dish-desc{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.dish-meta{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.dish-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:8px}
.dish-price{font-family:var(--font-num);font-weight:800;font-size:19px;color:var(--rose-700)}
.dish-price small{font-size:11px;font-weight:700;color:var(--ink-soft);margin-right:1px}
.dish-acts{display:flex;gap:6px;align-items:center;flex:none}
.fav-btn{width:var(--tap);height:var(--tap);border-radius:999px;display:flex;align-items:center;justify-content:center;
  color:var(--icon-idle);transition:transform .12s var(--ease), color .15s}
.fav-btn .icon{width:23px;height:23px}
.fav-btn.on{color:var(--rose-500)}
.add-btn{width:var(--tap);height:var(--tap);border-radius:999px;background:var(--rose-600);color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(200,73,94,.3);transition:transform .12s var(--ease)}
.add-btn:active{transform:scale(.88)}
.home-foot{text-align:center;font-size:11.5px;color:var(--muted-ink);padding:6px 0 2px;line-height:1.7}
/* 筛选状态条：告诉用户当前叠加了什么，为什么只剩这么几道 */
.filter-summary{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);
  background:var(--surface-2);border-radius:10px;padding:8px 11px;margin-bottom:12px}
.filter-summary .icon{flex:none;width:14px;height:14px}
.filter-summary span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filter-summary button{flex:none;color:var(--rose-700);font-weight:700;font-size:12px;min-height:28px;padding:0 4px}
.load-sentinel{height:1px}
.load-more{width:100%;margin:4px 0 14px;min-height:var(--tap);font-size:13.5px}
/* 筛选抽屉 */
.flt-body{padding-bottom:78px}   /* 给底部 sticky 按钮留位 */
.flt-group{margin-top:12px}
.flt-group:first-of-type{margin-top:8px}
.flt-group h5{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:7px}
.flt-chips{display:flex;flex-wrap:wrap;gap:8px}
.flt-chips .chip{min-height:var(--tap);font-size:13px;padding:0 13px}
.flt-more{width:100%;min-height:34px;background:transparent;color:var(--rose-700);
  font-size:12.5px;font-weight:700;text-align:left}
.flt-foot{display:flex;flex-direction:column;gap:6px;margin-top:14px;position:sticky;bottom:-4px;
  background:var(--surface);padding:10px 0 4px}
.flt-btns{display:flex;gap:10px}
.flt-btns .btn{flex:1;min-height:48px}
.flt-foot .btn{flex:1;min-height:48px}
/* 身份提示条：让"我现在是谁""要不要切过去"变成看得见的事，而不是靠记 */
.role-note{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border-radius:var(--r-md);
  padding:11px 13px;margin-bottom:12px;font-size:13px;font-weight:700;line-height:1.4;box-shadow:var(--shadow-1)}
.role-note .icon{width:18px;height:18px;flex:none}
.role-note.chef{background:var(--butter-100);color:var(--butter-700)}
.role-note.baby{background:var(--rose-50);color:var(--rose-700)}
.role-note .rn-btn{margin-left:auto;flex:none;white-space:nowrap;min-height:32px;padding:0 12px;border-radius:99px;
  background:rgba(255,255,255,.75);font-size:12px;font-weight:700;color:inherit}
.home-foot b{color:var(--rose-500);font-weight:700}
.home-foot button{display:inline-flex;align-items:center;min-height:var(--tap);color:var(--rose-700);font-weight:800;text-decoration:underline;font-size:11.5px;padding:0 10px}

/* 空状态 */
.empty-box{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-1);
  padding:34px 22px;text-align:center}
.empty-box .eb-art{width:88px;height:88px;margin:0 auto 12px;color:var(--rose-300)}
.empty-box h3{font-family:var(--font-title);font-size:17px;font-weight:400}
.empty-box p{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.6}
.empty-box .btn{margin-top:16px;min-height:var(--tap);padding:0 24px;font-size:15px}
.suggest-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}

/* ============ 详情页 ============ */
.dt-head{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:58px 14px 10px;background:linear-gradient(to bottom, var(--bg) 78%, rgba(255,246,239,0))}
.icon-btn{width:var(--tap);height:var(--tap);border-radius:999px;background:var(--surface);border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft);box-shadow:var(--shadow-1);transition:transform .12s var(--ease)}
.icon-btn:active{transform:scale(.92)}
.dt-title{flex:1;text-align:center;font-family:var(--font-title);font-size:18px;letter-spacing:.5px}
.dt-head .ph{width:var(--tap);flex:none}
.dt-body{padding:0 18px 136px}
.dt-hero{position:relative;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--shadow-1);background:var(--surface-2)}
.dt-hero .hc-art{display:block;width:100%;height:225px;background:var(--surface-2)}
.dt-hero .fav-float{position:absolute;right:12px;top:12px;width:var(--tap);height:var(--tap);border-radius:999px;
  background:rgba(255,246,239,.94);display:flex;align-items:center;justify-content:center;color:var(--icon-idle);box-shadow:var(--shadow-1)}
.dt-hero .fav-float.on{color:var(--rose-500)}
.dt-name-row{display:flex;align-items:baseline;gap:10px;margin-top:16px;flex-wrap:wrap}
.dt-name{font-family:var(--font-title);font-size:25px;letter-spacing:.5px}
.dt-price{font-family:var(--font-num);font-weight:800;font-size:21px;color:var(--rose-700)}
.dt-price small{font-size:11px;color:var(--ink-soft);font-weight:700}
.dt-rating{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:13px;color:var(--ink-soft);flex-wrap:wrap}
.dt-rating .hearts,.hearts{display:flex;gap:2px;color:var(--rose-500)}
.hearts .icon{width:15px;height:15px}
.dt-info{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.dt-note{margin-top:17px;background:var(--rose-50);border-radius:var(--r-lg);padding:16px 16px 14px;position:relative}
.dt-note .dn-label{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--rose-700);margin-bottom:7px}
.dn-text{font-family:var(--font-hand);font-size:15.5px;line-height:1.85;color:var(--ink)}
.dt-sec{margin-top:20px}
.dt-sec h4{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:800}
.dt-sec h4 .icon{color:var(--rose-500)}
.ing-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.ing{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--ink);font-weight:600}
.step{display:flex;gap:11px;margin-top:12px;align-items:flex-start}
.step .st-no{width:24px;height:24px;border-radius:999px;background:var(--rose-100);color:var(--rose-700);
  font-family:var(--font-num);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.step p{font-size:13.5px;line-height:1.65;color:var(--ink)}
.review-card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:15px 16px;margin-top:12px}
.review-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.review-head .hearts{margin-left:auto}
.review-text{font-family:var(--font-hand);font-size:15px;line-height:1.8;margin-top:8px}
.review-date{font-size:11.5px;color:var(--muted-ink);margin-top:7px}

/* 详情底部已点条 */
.dt-cart-strip{position:absolute;left:16px;right:16px;bottom:88px;z-index:31;
  display:flex;align-items:center;gap:8px;min-height:52px;padding:0 6px 0 16px;
  background:var(--surface);border-radius:999px;box-shadow:var(--shadow-1);border:1.5px solid var(--rose-100);
  transform:translateY(10px);opacity:0;pointer-events:none;transition:.2s var(--ease);
  width:calc(100% - 32px);text-align:left}
.dt-cart-strip.show{transform:translateY(0);opacity:1;pointer-events:auto}
.dt-cart-strip .dcs-info{flex:1;font-size:13.5px;font-weight:700;color:var(--ink)}
.dt-cart-strip .dcs-go{min-height:var(--tap);padding:0 16px;border-radius:999px;background:var(--rose-50);color:var(--rose-700);font-size:13.5px;font-weight:800;display:flex;align-items:center}

/* ============ 确认点菜页 ============ */
.od-body{padding:58px 18px 136px}
.od-list .od-item{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-1);
  padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:12px}
.od-item .odi-art{width:58px;height:58px;border-radius:var(--r-sm);flex:none;background:var(--surface-2);overflow:hidden;padding:0}
.od-info{flex:1;min-width:0}
.od-info .oi-name{font-size:15px;font-weight:700}
.od-info .oi-price{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.od-info .oi-price .num{color:var(--rose-700);font-size:14px}
.stepper{display:flex;align-items:center;gap:2px;flex:none}
.st-btn{width:var(--tap);height:var(--tap);border-radius:999px;display:flex;align-items:center;justify-content:center;
  background:var(--rose-50);color:var(--rose-700);transition:transform .12s var(--ease)}
.st-btn:active{transform:scale(.88)}
.st-btn.trash{background:transparent;color:var(--icon-idle)}
.st-num{min-width:28px;text-align:center;font-family:var(--font-num);font-weight:800;font-size:16px}
.od-sec{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:15px 16px;margin-bottom:12px}
.od-sec h4{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:800}
.od-sec h4 .icon{color:var(--rose-500)}
.od-sec .sec-hint{font-size:11.5px;color:var(--muted-ink);margin-top:6px}
.note-chips,.when-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.note-input{margin-top:11px;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;
  font-family:inherit;font-size:16px;color:var(--ink);width:100%;height:72px;resize:none;outline:none;background:var(--bg)}
.note-input:focus{border-color:var(--rose-300)}
.note-count{text-align:right;font-size:11px;color:var(--muted-ink);margin-top:5px}
.sum-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--ink-soft);padding:4px 0}
.sum-row b{color:var(--ink);font-weight:700}
.sum-row .num{font-size:16px}
.sum-total{border-top:1.5px dashed var(--line);margin-top:8px;padding-top:11px}
.sum-total .st-label{font-size:15px;font-weight:800;color:var(--ink)}
.sum-total .st-num{font-family:var(--font-num);font-weight:800;font-size:23px;color:var(--rose-700)}
.pay-bar .pb-total{display:flex;flex-direction:column;align-items:flex-start;padding-left:6px;min-width:86px}
.pay-bar .pb-total .t1{font-size:11.5px;color:var(--ink-soft)}
.pay-bar .pb-total .t2{font-family:var(--font-num);font-weight:800;font-size:21px;color:var(--rose-700)}
.pay-bar .btn-primary{flex:1}

/* ============ 成功页 ============ */
.suc-body{padding:76px 24px 40px;text-align:center;position:relative;overflow:hidden}
.suc-mark{width:96px;height:96px;margin:0 auto;position:relative}
.suc-mark .icon{width:96px;height:96px;color:var(--rose-600);animation:pop .5s var(--ease)}
.suc-body h1{font-family:var(--font-title);font-size:30px;margin-top:14px;letter-spacing:1px}
.suc-sub{font-size:14px;color:var(--ink-soft);margin-top:7px}
.chef-reply{margin-top:24px;background:var(--rose-50);border-radius:var(--r-lg);padding:17px 16px;text-align:left;position:relative}
.cr-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.cr-avatar{width:34px;height:34px;border-radius:999px;background:var(--rose-100);display:flex;align-items:center;justify-content:center;flex:none;border:2px solid #fff}
.cr-name{font-size:13px;font-weight:800;color:var(--rose-700)}
.cr-name small{font-weight:600;color:var(--ink-soft);margin-left:5px;font-size:11px}
.cr-text{font-family:var(--font-hand);font-size:15.5px;line-height:1.85;color:var(--ink)}
.suc-sum{margin-top:16px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:15px 16px;text-align:left}
.suc-sum .row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--ink-soft);padding:3.5px 0}
.suc-sum .row b{color:var(--ink);font-weight:700;text-align:right}
.suc-eta{display:flex;align-items:center;gap:8px;margin-top:11px;background:var(--butter-100);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;font-weight:700;color:var(--butter-700)}
.suc-btns{display:flex;flex-direction:column;gap:11px;margin-top:26px}
.suc-btns .btn{width:100%}
.cf{position:absolute;top:-12px;width:9px;height:9px;pointer-events:none;z-index:5}

/* ============ 订单页 ============ */
.page-title{font-family:var(--font-title);font-size:23px;letter-spacing:.5px;padding:60px 20px 8px;outline:none}
.odr-tabs{display:flex;flex-wrap:wrap;gap:8px;padding:10px 18px 12px}
.odr-body{padding:0 18px 120px}
.order-card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:15px 16px;margin-bottom:13px}
.oc-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.oc-date{font-size:12.5px;color:var(--ink-soft);font-weight:600}
.oc-id{font-size:11px;color:var(--muted-ink);font-family:var(--font-num)}
.oc-badge{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;border-radius:999px;padding:5px 11px}
.oc-badge.pending{background:var(--butter-100);color:var(--butter-700)}
.oc-badge.accepted{background:var(--rose-50);color:var(--rose-700)}
.oc-badge.cooking{background:var(--rose-100);color:var(--rose-700)}
.oc-badge.served{background:var(--green-100);color:var(--green-700)}
.oc-badge.rated{background:var(--surface-2);color:var(--ink-soft)}
.oc-badge.declined,.oc-badge.cancelled{background:var(--surface-2);color:var(--muted-ink)}
.oc-dishes{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.oc-dishes .od-d,.od-d{display:block;width:52px;height:52px;border-radius:var(--r-sm);background:var(--surface-2);overflow:hidden;flex:none}
.oc-dishes .more-dish{width:52px;height:52px;border-radius:var(--r-sm);background:var(--rose-50);color:var(--rose-700);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-weight:800;font-size:13px}
.oc-line{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--ink-soft)}
.oc-line .num{font-size:16px;color:var(--ink);font-weight:800}
.oc-status{font-size:12.5px;color:var(--ink-soft);margin-top:9px;display:flex;align-items:center;gap:6px}
.oc-note{font-size:12px;color:var(--muted-ink);margin-top:7px}
.oc-review{margin-top:11px;background:var(--bg);border-radius:var(--r-sm);padding:10px 12px}
.oc-review .rv-text{font-family:var(--font-hand);font-size:14px;line-height:1.7}
.oc-review .rv-meta{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted-ink);margin-top:5px}
.oc-review .hearts .icon{width:12px;height:12px}
.oc-acts{display:flex;gap:10px;margin-top:13px;flex-wrap:wrap}
.oc-acts .btn{min-height:var(--tap);font-size:14px;flex:1;min-width:120px}

/* ============ 钱包页 ============ */
.wa-body{padding:58px 18px 120px}
.balance-card{background:var(--rose-600);border-radius:var(--r-xl);padding:22px 20px 18px;color:#fff;
  box-shadow:0 14px 30px rgba(200,73,94,.35);position:relative;overflow:hidden}
.bc-deco{position:absolute;right:-26px;top:-30px;opacity:.16;color:#fff}
.bc-deco .icon{width:130px;height:130px}
.bc-label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;opacity:.95}
.bc-num{display:flex;align-items:baseline;gap:8px;margin-top:12px}
.bc-num .n{font-family:var(--font-num);font-weight:800;font-size:46px;line-height:1;letter-spacing:.5px}
.bc-num .u{font-size:14px;font-weight:700;opacity:.95}
.bc-sub{font-size:12.5px;opacity:.95;margin-top:11px;line-height:1.6}
.bc-acts{display:flex;gap:10px;margin-top:17px;flex-wrap:wrap}
.bc-acts .btn{flex:1;min-height:48px;font-size:14.5px;min-width:120px}
.bc-acts .btn-w{background:#fff;color:var(--rose-700)}
.bc-acts .btn-wt{background:rgba(255,255,255,.18);color:#fff;border:1.5px solid rgba(255,255,255,.55)}
.info-card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:15px 16px;margin-top:14px}
.info-card h5{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:800}
.info-card h5 .icon{color:var(--rose-500)}
.info-card p{font-size:12px;color:var(--ink-soft);margin-top:7px;line-height:1.6}
.info-card p b{color:var(--ink)}
/* 撒娇记录：把待批/已批/拒绝理由留在宝贝这边，不用切身份才知道结果 */
.ag-log{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.ag-row{display:flex;align-items:flex-start;gap:10px;font-size:12px;color:var(--ink-soft);line-height:1.5}
.ag-row .ag-note{flex:1;min-width:0;font-weight:700;color:var(--ink)}
.ag-row .ag-status{flex:none;max-width:46%;text-align:right;font-weight:800}
.ag-row .ag-status.waiting{color:var(--butter-700)}
.ag-row .ag-status.approved{color:var(--green-700)}
.ag-row .ag-status.rejected{color:var(--rose-700)}
.ag-row .ag-status.expired{color:var(--muted-ink)}
.cycle-bar{height:9px;border-radius:99px;background:var(--rose-50);margin-top:11px;overflow:hidden}
.cycle-bar i{display:block;height:100%;border-radius:99px;background:var(--butter-500)}
.ledger-sec{margin-top:22px}
.ledger-head{display:flex;align-items:center;gap:8px}
.ledger-head h4{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:800}
.ledger-head h4 .icon{color:var(--rose-500)}
.ledger-head .refresh{margin-left:auto}
.ledger-head .refresh .icon{width:20px;height:20px}
.refresh.busy .icon{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-banner{margin-top:12px;background:var(--butter-100);border-radius:var(--r-md);padding:11px 14px;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12.5px;color:var(--butter-700);font-weight:600}
.sync-banner .btn-retry{margin-left:auto;min-height:var(--tap);padding:0 14px;border-radius:999px;background:var(--butter-500);color:#4A3305;font-size:12px;font-weight:800}
.ledger-month{font-size:13px;font-weight:800;color:var(--ink-soft);margin:16px 0 8px;display:flex;align-items:center;gap:7px}
.ledger-month::after{content:"";flex:1;height:1.5px;background:var(--line)}
.lg-row{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-1);padding:13px 15px;margin-bottom:9px}
.lg-icon{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.lg-icon.coin{background:var(--rose-50);color:var(--rose-600)}
.lg-icon.dish{background:var(--butter-100);color:var(--butter-700)}
.lg-icon.gift{background:var(--green-100);color:var(--green-700)}
.lg-icon.refund{background:var(--surface-2);color:var(--ink-soft)}
.lg-info{flex:1;min-width:0}
.lg-info .t{font-size:14px;font-weight:700}
.lg-info .d{font-size:11.5px;color:var(--muted-ink);margin-top:2px}
.lg-amt{font-family:var(--font-num);font-weight:800;font-size:16.5px;flex:none}
.lg-amt.plus{color:var(--green-700)}
.lg-amt.minus{color:var(--rose-700)}
.storage-note{margin-top:18px;background:var(--surface-2);border-radius:var(--r-md);padding:12px 14px;font-size:11.5px;color:var(--muted-ink);line-height:1.7}
.storage-note button{display:inline-flex;align-items:center;min-height:var(--tap);color:var(--rose-700);font-weight:800;text-decoration:underline;font-size:11.5px;padding:0 8px}

/* 撒娇模态 */
.aegyo-art{width:88px;height:88px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center}
.aegyo-art .icon{width:84px;height:84px;color:var(--rose-500)}
.aegyo-art.sending .icon{animation:heartBeat 1.1s infinite}
.aegyo-art.done .icon{animation:pop .5s var(--ease)}
.ag-h3{font-family:var(--font-title);font-size:21px;text-align:center;letter-spacing:.5px}
.ag-sub{text-align:center;font-size:13.5px;color:var(--ink-soft);margin-top:8px;line-height:1.7}
.ag-btn{width:100%;margin-top:18px}
.ad-num{font-family:var(--font-num);font-weight:800;font-size:32px;color:var(--rose-700);text-align:center}
.amt-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.amount-chip{min-height:var(--tap);padding:0 18px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);
  font-family:var(--font-num);font-weight:800;font-size:16px;color:var(--rose-700)}
.amount-chip.hint{background:var(--rose-600);border-color:var(--rose-600);color:#fff}

/* 工作台 */
.kt-body{padding:58px 18px 120px}
.kt-search{margin:0 0 12px}
.kt-note{background:var(--surface-2);border-radius:var(--r-md);padding:11px 13px;font-size:11.5px;color:var(--muted-ink);line-height:1.6;margin-bottom:14px;display:flex;gap:7px}
.kt-note .icon{width:15px;height:15px;flex:none;margin-top:1px}
.mood-card{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:14px 16px;margin-bottom:14px}
.mood-card .mc-face{width:44px;height:44px;border-radius:99px;background:var(--rose-50);display:flex;align-items:center;justify-content:center;flex:none;color:var(--rose-600)}
.mood-card .mc-t{font-size:14px;font-weight:800}
.mood-card .mc-d{font-size:11.5px;color:var(--muted-ink);margin-top:3px;line-height:1.5}
.sec-h{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:800;margin:20px 0 10px}
.sec-h .icon{color:var(--rose-500)}
.sec-h .count{margin-left:auto;font-size:12px;color:var(--muted-ink);font-weight:700;font-family:var(--font-num)}
.task-card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:15px 16px;margin-bottom:12px}
.task-card .tk-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800}
.task-card .tk-h .tk-time{margin-left:auto;font-size:11px;color:var(--muted-ink);font-family:var(--font-num)}
.task-card .tk-b{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.7}
.task-card .tk-a{display:flex;gap:9px;margin-top:13px;flex-wrap:wrap}
.task-card .tk-a .btn{min-height:var(--tap);flex:1;min-width:104px;font-size:14px}
.wish-row{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-1);padding:12px 14px;margin-bottom:9px}
.wish-row .wr-n{flex:1;min-width:0;font-size:14px;font-weight:700}
.wish-row .wr-s{font-size:11px;color:var(--muted-ink);margin-top:2px;font-weight:600}
.wish-row .wr-act{display:flex;gap:6px;flex:none}
.mini-btn{min-height:var(--tap);padding:0 14px;border-radius:99px;background:var(--rose-50);color:var(--rose-700);font-size:12.5px;font-weight:800;display:flex;align-items:center}
.mini-btn.ghost{background:var(--surface-2);color:var(--muted-ink)}
.dish-new-form{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.dish-new-form label{font-size:12px;font-weight:700;color:var(--ink-soft)}
.dish-new-form input,.dish-new-form select{min-height:var(--tap);border:1.5px solid var(--line);border-radius:var(--r-sm);
  padding:0 12px;font-family:inherit;font-size:16px;color:var(--ink);background:var(--bg);outline:none;width:100%}
.dish-new-form input:focus,.dish-new-form select:focus{border-color:var(--rose-300)}
.dish-new-form .two{display:flex;gap:10px}
.dish-new-form .two>div{flex:1}
.art-pick{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.art-pick button{width:52px;height:52px;border-radius:14px;background:var(--surface-2);overflow:hidden;border:2px solid transparent}
.art-pick button[aria-pressed="true"]{border-color:var(--rose-600)}

/* 评价屏 */
.rv-body{padding:58px 22px 140px}
.rv-order{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:15px 16px;margin-top:14px}
.rv-order .ro-line{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-soft);padding:4px 0;gap:10px}
.rv-order .ro-line b{color:var(--ink);text-align:right}
.hearts-pick{display:flex;gap:4px;justify-content:center;margin:22px 0 6px}
.hearts-pick button{width:var(--tap);height:var(--tap);display:flex;align-items:center;justify-content:center;color:var(--rose-300);border-radius:99px}
.hearts-pick button.on{color:var(--rose-500)}
.hearts-pick .icon{width:28px;height:28px}
.rv-mood{text-align:center;font-size:13px;color:var(--ink-soft);min-height:20px}
.rv-quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}

/* ============ 全出血适配（真机打开） ============ */
@media (max-width:480px){
  body{background:var(--bg)}
  .phone-shell{--shell-r:0px;width:100vw;height:100dvh;max-height:none;max-width:none;border-radius:0;box-shadow:none}
  .notch,.home-indicator{display:none}
  .status-bar{height:calc(20px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}
  .home-head{padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .dt-head,.od-body,.wa-body,.kt-body,.rv-body,.page-title{padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .suc-body{padding-top:calc(48px + env(safe-area-inset-top,0px))}
  .suc-mark{width:76px;height:76px}
  .suc-mark .icon{width:76px;height:76px}
}
@media (max-height:900px) and (min-width:481px){
  .phone-shell{width:auto;height:calc(100vh - 32px);aspect-ratio:390/844}
}

/* ============ 动效纪律 ============ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .skel::after{animation:none}
  .cf{display:none}
}

const hourPart = h => h < 11 ? 'morning' : h < 14 ? 'noon' : h < 17 ? 'afternoon' : h < 21 ? 'evening' : 'latenight';
const nowPart = () => hourPart(new Date().getHours());
function daysBetween(aKey, bKey) { return Math.round((dateOf(bKey) - dateOf(aKey)) / 86400000); }
function nextGrantKey() { const d = new Date(); return keyOf(new Date(d.getFullYear(), d.getMonth() + 1, 1)); }

/* ---------- 可复现随机：同一天同一序号，结果恒定 ---------- */
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(...parts) {
  let a = hashStr(parts.join('|'));
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

    const emptyHint = favEmpty ? '在菜单里点心形，就会出现在这里'
      : filterEmpty ? '把条件放宽一点，或者清空筛选看全部'
      : (near.length ? '这几道有点像，先凑合一下？' : '大厨的学做清单还空着位置～');

      '<div class="eb-art">' + IC('bowl', 'width:84px;height:84px') + '</div>' +
      '<h3>' + esc(emptyTitle) + '</h3>' +
      '<p>' + emptyHint + '</p>' +

        '<button class="chip chip--sm" data-action="detail" data-id="' + esc(d.id) + '" data-dir="fwd">' + esc(d.name) + '</button>').join('') + '</div>' : '') +
      (filterEmpty ? '<button class="btn btn-soft" data-action="clear-filter">' + IC('filter') + ' 清空筛选</button>'

      '</div>';
  } else {
    const limit = Math.max(RENDER_STEP, state.renderLimit || RENDER_STEP);
    html += list.slice(0, limit).map(cardHTML).join('');
    if (list.length > limit) {
      /* 哨兵在按钮前：滚到这儿就自动加载，按钮留给"不想等"和 IO 不支持的情况 */
      html += '<div class="load-sentinel" aria-hidden="true"></div>' +
        '<button class="btn btn-soft load-more" data-action="load-more">还有 ' +
        (list.length - limit) + ' 道，继续看</button>';
    }
  }
  const wishCount = state.wished.filter(w => w.status !== 'done').length;
  html += '<p class="home-foot">由大厨用爱维护 · 已收录 <b>' + state.dishes.length + '</b> 道菜 · 连续点菜 ' +
    state.meta.streak + ' 天<br>' + (chef
      ? '<button data-action="tab" data-target="kitchen" data-dir="fwd">去工作台（' + kitchenTodo() + ' 件事待办）</button>'
      : (wishCount ? '<button data-action="open-wish">' + '你馋的 ' + wishCount + ' 道还在学做清单里，去看看' + '</button>'
        : '<button data-action="open-wish">想吃什么还没被学？现在馋给大厨</button>')) + '</p>';
  box.innerHTML = html;
  armImgs(box);
  updateCartBar();
  centerActiveCat();
  armLoadMore();
}
/* 滚到底自动加载。每次重绘都要重新挂：哨兵是新 DOM，旧 observer 已经失效 */
let moreIO = null;
function armLoadMore() {
  if (moreIO) { moreIO.disconnect(); moreIO = null; }
  if (!('IntersectionObserver' in window)) return;
  const sentinel = $('.load-sentinel');
  if (!sentinel) return;
  moreIO = new IntersectionObserver(es => {
    if (!es.some(e => e.isIntersecting)) return;
    moreIO.disconnect(); moreIO = null;
    /* 自动加载不弹 toast：用户没点任何东西，弹提示反而吵 */
    state.renderLimit = (state.renderLimit || RENDER_STEP) + RENDER_STEP;
    commit();
  }, { root: $('#home-scroll'), rootMargin: '260px' });
  moreIO.observe(sentinel);
}
/* 横滚时选中的分类可能被右侧渐隐切掉一半：把它滚到可视区中间。
   用直接定位而不是 smooth：renderHome 每次都重建 innerHTML，平滑动画会被下一次重绘打断，
   实测连续点击时停在半路（偏差 27~54px）。等一帧是为了让新 DOM 完成布局 */
function centerActiveCat() {
  requestAnimationFrame(() => {
    const row = $('#cat-row');
    if (!row) return;
    const el = row.querySelector('.chip.on');
    if (!el) return;
    const rr = row.getBoundingClientRect(), er = el.getBoundingClientRect();
    const delta = (er.left - rr.left) - (rr.width - er.width) / 2;
    if (Math.abs(delta) < 6) return;
    row.scrollLeft += delta;
  });
}

/* ---------------- 大厨工作台 ---------------- */
/* 心情按天种子：同一天刷新结果一致；被催太多次只会更差 */
const MOODS = {
  good: { label: '心情不错 · 好说话', range: [40, 60] },
  plain: { label: '平常 · 按规矩给', range: [10, 39] },
  busy: { label: '有点忙 · 短平快', range: [10, 19] },
  diet: { label: '在减肥 · 钱包和你都要', range: [10, 25] },
};
function chefMood() {
  const keys = ['good', 'plain', 'busy', 'diet'];
  /* 只算还没做完的单：上个月催过 5 次，不该让这个月的心情永久变差 */
  const nag = state.orders.filter(o => ['pending', 'accepted', 'cooking'].indexOf(o.chefState) >= 0)
    .reduce((a, o) => a + (o.nagCount || 0), 0);
  let i = Math.floor(rng(LS_KEY, 'mood', state.meta.today)() * keys.length);
  if (nag > 3) i = Math.min(keys.length - 1, i + 1);
  const key = keys[i];
  return { key: key, label: MOODS[key].label, range: MOODS[key].range };
}
function aegyoSuggest(blob) {
  const m = chefMood();
  const o = orderById(blob.ref) || null;
  const r = rng(LS_KEY, 'aegyo', blob.d, blob.id);
  const base = Math.round((m.range[0] + (m.range[1] - m.range[0]) * r()) / 5) * 5;
  const bumped = o && o.nagCount ? base + Math.min(15, o.nagCount * 5) : base;
  return Math.max(AEGYO_FLOOR, Math.min(AEGYO_DAILY_CAP, bumped));
}
/* 今日净餐费（支出 - 退款）：撒娇的"报销"基数 */
function aegyoSpentToday() {
  return state.ledger.filter(e => e.d === todayKey() && (e.k === 'dish' || e.k === 'refund'))
    .reduce((a, e) => a - e.a, 0);
}
/* 上限必须把购物车算进去：否则"没花过钱 → 上限 10 → 补不齐 → 花不了钱"会死锁 */
function aegyoCapFor(spent) {
  return Math.min(AEGYO_DAILY_CAP, AEGYO_FLOOR + Math.floor(Math.max(0, spent) / 10) * 10);
}
function aegyoCap() { return aegyoCapFor(aegyoSpentToday() + cartTotal()); }
function aegyoApprovedToday() {
  return state.inbox.filter(b => b.kind === 'aegyo' && b.d === todayKey() && b.status === 'approved')
    .reduce((a, b) => a + (b.amount || 0), 0);
}
function aegyoBudget() { return Math.max(0, aegyoCap() - aegyoApprovedToday()); }
/* 还差多少才付得起这一单 */
function aegyoGap() { return Math.max(0, +(cartTotal() - state.wallet.balance).toFixed(1)); }
/* 可批档位：10/20/30，再补一个「刚好够付这单」的档，都受当日剩余额度约束 */
function aegyoAmounts() {
  const budget = aegyoBudget(), gap = aegyoGap();
  const all = [AEGYO_FLOOR, 20, AEGYO_DAILY_CAP];
  if (gap > 0) all.push(Math.ceil(gap / 10) * 10);
  const uniq = all.filter((a, i) => all.indexOf(a) === i).sort((x, y) => x - y);
  return uniq.filter(a => a <= budget);
}
/* 推荐档位：有缺口就推「刚好够」，否则按心情建议就近取档 */
function aegyoHint(blob) {
  const list = aegyoAmounts();
  if (!list.length) return 0;
  const gap = aegyoGap();
  if (gap > 0) { const fit = list.find(a => a >= gap); if (fit) return fit; }
  const want = aegyoSuggest(blob);
  return list.reduce((best, a) => Math.abs(a - want) < Math.abs(best - want) ? a : best, list[0]);
}

const RENDER = { home: renderHome, detail: renderDetail, order: renderOrder, success: renderSuccess,
  orders: renderOrders, wallet: renderWallet, kitchen: renderKitchen, review: renderReview };
const TAB_SCREENS = ['home', 'orders', 'wallet', 'kitchen'];
let modalOpen = false;
const a11yBackup = new WeakMap();

function setA11yOff(el, off) {
  if (!el) return;
  el.setAttribute('aria-hidden', off ? 'true' : 'false');
  if ('inert' in HTMLElement.prototype) { el.inert = off; return; }
  if (off) {
    const saved = $$(FOCUSABLE, el).map(f => { const t = f.getAttribute('tabindex'); f.tabIndex = -1; return t; });
    a11yBackup.set(el, saved);
  } else {
    const saved = a11yBackup.get(el);
    if (saved) { $$(FOCUSABLE, el).forEach((f, i) => { const t = saved[i]; if (t === null || t === undefined) f.removeAttribute('tabindex'); else f.setAttribute('tabindex', t); }); a11yBackup.delete(el); }
  }
}
/* 只有一个源决定谁可交互：当前屏 + 是否有弹窗压在上面。
   屏内的悬浮条与底部操作条随父屏一起被 inert，不用单独处理 */
function syncA11y() {
  const active = $('.screen.active');
  $$('.screen').forEach(s => setA11yOff(s, modalOpen || s !== active));
  setA11yOff($('#tab-bar'), modalOpen);
}
function navTo(target, opts) {
  opts = opts || {};
  if (!RENDER[target]) { console.warn('[小食光] 没有这块屏：', target); return; }
  if (target === 'kitchen' && state.me !== 'chef') { toast('先切到大厨身份，才进得了厨房'); return; }
  if (target === 'order' && state.me !== 'baby') { toast('大厨不用付钱，去工作台接单'); target = 'kitchen'; }
  if (target === 'review' && !orderById(state.reviewOrderId)) { toast('先点一份，再回来打分'); return; }
  /* 进厨房前先把展开数量重置：管理界面每次进来都从头看，且必须在 RENDER 之前，
     否则这一次渲染用的还是上次的 300 条 */
  if (target === 'kitchen') {
    state.kitchenLimit = 12;
    state.kitchenQ = '';
    if (!state.meta.seenKitchen) { state.meta.seenKitchen = true; saveState(); }
  }
  const sc0 = $('#' + state.screen + '-scroll'); if (sc0) state.scrollPos[state.screen] = sc0.scrollTop;
  $('#shell').classList.toggle('nav-back', opts.dir === 'back');
  state.screen = target;
  $$('.screen').forEach(s => s.classList.remove('active'));
  const el = $('.screen[data-screen="' + target + '"]');
  RENDER[target]();
  if (state.screen !== target) return;                    // 渲染中被改道，交给内层 navTo 收尾
  el.classList.add('active');
  $('#tab-bar').classList.toggle('hidden', TAB_SCREENS.indexOf(target) < 0);
  renderChrome(); syncA11y(); updateCartBar(); updateDetailStrip();
  document.title = '小食光 · ' + SCREEN_TITLE[target];
  const sc = $('#' + target + '-scroll'); if (sc) sc.scrollTop = state.scrollPos[target] || 0;
  const h = el.querySelector('.scr-h'); if (h) h.focus({ preventScroll: true });
}
function patchCard(id) {

/* ---------------- 弹窗（焦点陷阱 + 关闭归还 + 定时器回收） ---------------- */
let modalOpener = null, modalTimers = [];
function later(fn, ms) { const t = setTimeout(fn, ms); modalTimers.push(t); return t; }
function openModal(html, label, focusSel) {
  const card = $('#modal-card');
  card.innerHTML = '<div class="modal-grab" aria-hidden="true"></div>' + html;
  card.setAttribute('aria-label', label || '小提示');
  $('#modal-root').classList.add('show');
  $('#modal-root').setAttribute('aria-hidden', 'false');
  if (!modalOpen) modalOpener = document.activeElement;   // 弹窗内换页不覆盖最初的触发点
  modalOpen = true;
  syncA11y();
  const f = focusSel ? $(focusSel, card) : $(FOCUSABLE, card);
  if (f) f.focus();
}
function closeModal() {
  modalTimers.forEach(clearTimeout); modalTimers = [];
  $('#modal-root').classList.remove('show');
  $('#modal-root').setAttribute('aria-hidden', 'true');
  modalOpen = false;
  $('#modal-card').innerHTML = '';
  syncA11y();
  /* 触发点已随重绘消失时，焦点退回当前屏标题，不落回 body */
  const back = modalOpener && document.contains(modalOpener) ? modalOpener : ($('.screen.active .scr-h') || $('#modal-card'));
  if (back) back.focus({ preventScroll: true });
  modalOpener = null;
}
/* ---------------- 订单状态机 ---------------- */
function applyTransition(id, action, payload) {
  const o = orderById(id);
  if (!o) { toast('这单找不到了'); return null; }
  const to = (FLOW[o.chefState] || {})[action];
  if (!to) { toast('这单现在的状态做不了这一步'); return null; }
  o.chefState = to;
  if (to === 'declined' || to === 'cancelled') bookMoney(o.total, '退款 · ' + o.id, 'refund', o.id);
  if (to === 'rated') {
    o.reviewed = true;
    o.review = { hearts: payload.hearts, text: payload.text || '（没写话，心就是话）', d: todayKey() };
    Object.keys(o.items).forEach(did => {
      const d = dish(did);
      if (!d.unknown) d.reviews.push({ d: todayKey(), hearts: payload.hearts, text: o.review.text, ref: o.id });
    });
  }
  return o;
}

/* ---------------- 事件绑定 ---------------- */
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const act = btn.dataset.action, fn = ACTIONS[act];
  if (!fn) { console.warn('[小食光] 动作没实现：', act); return; }
  if (!can(act)) { toast('这一步得由' + (state.me === 'chef' ? '宝贝' : '大厨') + '来做'); return; }
  fn(btn, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalOpen) { closeModal(); return; }
  if (e.key === 'Tab' && modalOpen) {
    const f = $$(FOCUSABLE, $('#modal-card')).filter(x => !x.disabled && x.tabIndex >= 0);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
$('#modal-root').addEventListener('click', e => { if (e.target.id === 'modal-root') closeModal(); });

let searchTimer = null;
let kitchenTimer = null;
function bindSearch() {
  const input = $('#search-input');
  input.addEventListener('input', () => {
    $('#search-clear').classList.toggle('show', !!input.value);
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.q = input.value; state.renderLimit = RENDER_STEP; renderHome(); }, 160);
  });
  /* 厨房菜单搜索是渲染出来的输入框，走委托；重绘后由 FOCUS_KEEP 还焦点 */
  document.addEventListener('input', e => {
    if (!e.target || e.target.id !== 'kitchen-search') return;
    const value = e.target.value;
    clearTimeout(kitchenTimer);
    kitchenTimer = setTimeout(() => {
      state.kitchenQ = value;
      state.kitchenLimit = 12;
      commit();
    }, 160);
  });
  /* 真机键盘别挡住输入：这些字段是渲染出来的，绑定时还不存在，所以走委托 */
  document.addEventListener('focusin', e => {
    const t = e.target;
    if (t && (t.id === 'note-input' || t.id === 'rv-text' || t.id === 'wish-name' || t.id === 'ag-note' || t.id === 'kitchen-search')) {
      setTimeout(() => t.scrollIntoView({ block: 'center', behavior: 'auto' }), 260);
    }
  });
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', () => {
      const kb = Math.max(0, innerHeight - visualViewport.height - visualViewport.offsetTop);
      $$('.action-bar').forEach(b => { b.style.transform = kb ? 'translateY(-' + kb + 'px)' : ''; });
    });
  }
}

  t('插画引用完整', state.dishes.every(d => ART_KEYS.indexOf(d.art) >= 0)
    && ART_KEYS.every(k => !!document.getElementById('art-' + k)));
  t('首屏池 ≥ 4', state.dishes.filter(d => HERO_POOL.indexOf(d.id) >= 0).length >= 4);
  t('收藏无失效引用', state.favs.every(id => !dish(id).unknown));
  t('撒娇上限 ≤ 30', aegyoCapFor(0) === 10 && aegyoCapFor(15) === 20 && aegyoCapFor(99) === 30
    && [0, 9, 10, 19, 20, 99].every(s => aegyoCapFor(s) >= 10 && aegyoCapFor(s) <= 30));
  t('状态机自洽', Object.keys(FLOW).every(k => Object.keys(FLOW[k]).every(a => !!FLOW[FLOW[k][a]]))
    && Object.keys(FLOW).every(k => typeof pick('badge.' + k) === 'string' && pick('badge.' + k).length > 0));
  t('迁移链完整且幂等', (() => {
    for (let v = 2; v < SCHEMA_VER; v++) if (typeof MIGRATIONS[v] !== 'function') return false;
    const s = { dishes: [{ id: 'hongshaorou' }] };
    MIGRATIONS[2](s); const n = s.dishes.length;
    MIGRATIONS[2](s);
    return s.dishes.length === n && V3_ADDED_IDS.every(id => s.dishes.some(d => d.id === id));
  })());
  t('账本种类合法', state.ledger.every(e => ['coin', 'dish', 'gift', 'refund'].indexOf(e.k) >= 0));
  if (report.fail.length) console.warn('[小食光] 自检未过：', report.fail);
  else console.info('[小食光] 自检通过 ' + report.pass.length + ' 项');
  window.__XSG = { state: state, ACTIONS: ACTIONS, RENDER: RENDER, pick: pick, report: report,
    cartQty: cartQty, cartDishes: cartDishes, cartTotal: cartTotal, balanceCheck: balanceCheck,
    aegyoSentToday: aegyoSentToday, chefMood: chefMood, aegyoSuggest: aegyoSuggest, navTo: navTo,
    commit: commit, applyTransition: applyTransition, openModal: openModal, closeModal: closeModal, dish: dish,
    aegyoCap: aegyoCap, aegyoCapFor: aegyoCapFor, aegyoBudget: aegyoBudget, aegyoAmounts: aegyoAmounts,
    heroDish: heroDish, HERO_POOL: HERO_POOL, CATS: CATS, ART_KEYS: ART_KEYS, FLOW: FLOW, MIGRATIONS: MIGRATIONS, COPY: COPY };
  return report;
}

/* ---------------- 启动 ---------------- */
(function boot() {
  const loaded = loadState();
  state = loaded.state;
  rolloverDay();
  renderChrome();
  state.loading = true;
  navTo('home');
  bindSearch();
  setTimeout(() => { state.loading = false; if (state.screen === 'home') renderHome(); syncA11y(); }, 460);
  if (loaded.reason === 'parse' || loaded.reason === 'version' || loaded.reason === 'inconsistent') {
    state.meta.degraded = true;
    toast(loaded.reason === 'inconsistent' ? '存档的账对不上，已用演示数据重新开始' : '数据格式读不懂，已用演示数据重新开始');
    saveState();
  }
  const styleEl = document.createElement('style');
  styleEl.textContent = '@keyframes cfFall{to{transform:translateY(620px) rotate(230deg);opacity:0}}';
  document.head.appendChild(styleEl);
  selfTest();
})();
</script>
