            <span class="ab-tag" id="avatar-tag" aria-hidden="true">宝</span>
          </button>
          <div class="greet">
            <h1 id="greet-h1" class="scr-h" tabindex="-1">宝贝，今天想吃点什么？</h1>
            <p class="greet-sub" id="greet-sub"></p>
          </div>
          <button class="wallet-chip" data-action="nav" data-target="wallet" data-dir="fwd" aria-label="查看我的零花钱余额">
            <svg class="icon icon-fill" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-coin"></use></svg>
            <span class="num" id="head-balance">0</span>
          </button>
        </div>
        <div class="search-bar">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"></use></svg>
          <input id="search-input" type="search" enterkeyhint="search" autocomplete="off"
                 placeholder="搜菜名、食材或口味" aria-label="搜索菜品">
          <button class="search-clear" id="search-clear" data-action="search-clear" aria-label="清空搜索">
            <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px" aria-hidden="true"><use href="#i-close"></use></svg>
          </button>
        </div>
      </header>
      <div class="cat-wrap">
        <nav class="cat-row" id="cat-row" aria-label="菜品分类"></nav>
        <button class="chip chip--surprise" data-action="surprise" aria-label="在当前条件里随机推荐一道菜">
          <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px" aria-hidden="true"><use href="#i-spark"></use></svg>手气
        </button>
        <button class="chip chip--filter" id="filter-btn" data-action="open-filter" aria-label="按菜系、主料、做法筛选">筛选</button>
      </div>
      <div class="home-body" id="home-list"></div>
    </div>
    <button class="cart-bar" id="cart-bar" data-action="nav" data-target="order" data-dir="fwd" aria-label="查看已点菜品并去结算">
      <span class="cb-count" id="cb-count">0</span>
      <span class="cb-info" id="cb-info">已选 0 道</span>
      <span class="cb-price"><small style="font-size:11px;opacity:.85;font-weight:700">合计</small> <span id="cb-total">0</span></span>
      <span class="cb-go" aria-hidden="true">去点菜</span>
    </button>
  </section>

    <div class="screen-scroll" id="order-scroll"></div>
    <div class="action-bar pay-bar" id="pay-bar"></div>

  </section>

  <!-- ============ 屏6：我的零花钱 ============ -->

    <div class="screen-scroll" id="review-scroll"></div>
    <div class="action-bar" id="review-actions"></div>
  </section>

  <nav class="tab-bar" id="tab-bar" aria-label="主导航"></nav>

  <div class="modal-mask" id="modal-root" aria-hidden="true">
    <div class="modal-card" id="modal-card" role="dialog" aria-modal="true" aria-label="小提示" tabindex="-1"></div>
  </div>

  <div class="toast-wrap" id="toast-wrap"><div class="toast" id="toast" role="status" aria-live="polite"></div></div>
  <span class="sr-only" id="live-region" aria-live="polite"></span>
</div>
</main>
